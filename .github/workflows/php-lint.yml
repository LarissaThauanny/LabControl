name: Testes estaticos do LabControl
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php-lint-and-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: PHP syntax check
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript tests
        run: node --test tests/demo-filter.test.js
